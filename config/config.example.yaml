# Example trumpbot config.
#
# Default install paths (resolved automatically when the field is "auto"):
#   macOS  → ~/.config/trumpbot/config.yaml
#   Linux  → /etc/trumpbot/config.yaml
#
# Environment placeholders ${VAR_NAME} are expanded at load time from
# the per-OS secrets.env (sourced by systemd or launchd).
#
# Any path field set to "auto" is resolved at startup against the
# OS-appropriate default in trumpbot.platform_paths. The same example
# therefore works on macOS and Linux without editing.

kalshi:
  base_url: "https://api.elections.kalshi.com/trade-api/v2"
  ws_url: "wss://api.elections.kalshi.com/trade-api/ws/v2"
  api_key_id: "${KALSHI_API_KEY_ID}"
  # "auto" → ~/.config/trumpbot/kalshi_private.pem (macOS) or
  #          /etc/trumpbot/kalshi_private.pem (Linux).
  private_key_path: "auto"
  private_key_passphrase: "${KALSHI_PRIVATE_KEY_PASSPHRASE}"
  # Phase 1 confirmed-active series. Other series can be added once their
  # event-ticker pattern is verified.
  target_series:
    - "KXTRUMPMEET"
  market_discovery_interval_sec: 300
  backfill_days: 60
  rate_per_sec: 100.0
  rate_burst: 40.0
  rate_limit_pct: 0.8

news:
  sources:
    - {name: "reuters", type: "rss", url: "https://www.reutersagency.com/feed/?best-topics=political-general&post_type=best", poll_interval_sec: 90, weight: 1.0, is_kalshi_approved: true}
    - {name: "ap", type: "rss", url: "https://apnews.com/hub/ap-top-news/feed", poll_interval_sec: 90, weight: 1.0, is_kalshi_approved: true}
    - {name: "bloomberg", type: "rss", url: "https://feeds.bloomberg.com/politics/news.rss", poll_interval_sec: 90, weight: 1.0, is_kalshi_approved: true}
    - {name: "nyt_politics", type: "rss", url: "https://rss.nytimes.com/services/xml/rss/nyt/Politics.xml", poll_interval_sec: 90, weight: 0.95, is_kalshi_approved: true}
    - {name: "nyt_world", type: "rss", url: "https://rss.nytimes.com/services/xml/rss/nyt/World.xml", poll_interval_sec: 90, weight: 0.95, is_kalshi_approved: true}
    - {name: "wapo_politics", type: "rss", url: "http://feeds.washingtonpost.com/rss/politics", poll_interval_sec: 90, weight: 0.95, is_kalshi_approved: true}
    - {name: "wapo_world", type: "rss", url: "http://feeds.washingtonpost.com/rss/world", poll_interval_sec: 90, weight: 0.95, is_kalshi_approved: true}
    - {name: "wsj_politics", type: "rss", url: "https://feeds.a.dj.com/rss/RSSPoliticsAndPolicy.xml", poll_interval_sec: 90, weight: 1.0, is_kalshi_approved: true}
    - {name: "wsj_world", type: "rss", url: "https://feeds.a.dj.com/rss/RSSWorldNews.xml", poll_interval_sec: 90, weight: 1.0, is_kalshi_approved: true}
    - {name: "axios", type: "rss", url: "https://api.axios.com/feed/", poll_interval_sec: 90, weight: 0.9, is_kalshi_approved: true}
    - {name: "politico_picks", type: "rss", url: "https://www.politico.com/rss/politicopicks.xml", poll_interval_sec: 90, weight: 0.9, is_kalshi_approved: true}
    - {name: "politico_wh", type: "rss", url: "https://rss.politico.com/whitehouse.xml", poll_interval_sec: 90, weight: 0.9, is_kalshi_approved: true}
    - {name: "semafor", type: "rss", url: "https://www.semafor.com/feed.xml", poll_interval_sec: 120, weight: 0.9, is_kalshi_approved: true}
    - {name: "the_information", type: "rss", url: "https://www.theinformation.com/feed", poll_interval_sec: 120, weight: 0.9, is_kalshi_approved: true}
    - {name: "cnn_politics", type: "rss", url: "http://rss.cnn.com/rss/cnn_allpolitics.rss", poll_interval_sec: 90, weight: 0.85, is_kalshi_approved: true}
    - {name: "cnn_world", type: "rss", url: "http://rss.cnn.com/rss/cnn_world.rss", poll_interval_sec: 90, weight: 0.85, is_kalshi_approved: true}
    - {name: "fox_politics", type: "rss", url: "https://moxie.foxnews.com/google-publisher/politics.xml", poll_interval_sec: 90, weight: 0.85, is_kalshi_approved: true}
    - {name: "fox_world", type: "rss", url: "https://moxie.foxnews.com/google-publisher/world.xml", poll_interval_sec: 90, weight: 0.85, is_kalshi_approved: true}
    - {name: "msnbc", type: "rss", url: "http://www.msnbc.com/feeds/latest", poll_interval_sec: 90, weight: 0.85, is_kalshi_approved: true}
    - {name: "nbc_politics", type: "rss", url: "https://feeds.nbcnews.com/nbcnews/public/politics", poll_interval_sec: 90, weight: 0.85, is_kalshi_approved: true}
    - {name: "nbc_world", type: "rss", url: "https://feeds.nbcnews.com/nbcnews/public/world", poll_interval_sec: 90, weight: 0.85, is_kalshi_approved: true}
    - {name: "abc_politics", type: "rss", url: "https://abcnews.go.com/abcnews/politicsheadlines", poll_interval_sec: 90, weight: 0.85, is_kalshi_approved: true}
    - {name: "abc_international", type: "rss", url: "https://abcnews.go.com/abcnews/internationalheadlines", poll_interval_sec: 90, weight: 0.85, is_kalshi_approved: true}
    - {name: "cbs_politics", type: "rss", url: "https://www.cbsnews.com/latest/rss/politics", poll_interval_sec: 90, weight: 0.85, is_kalshi_approved: true}
    - {name: "cbs_world", type: "rss", url: "https://www.cbsnews.com/latest/rss/world", poll_interval_sec: 90, weight: 0.85, is_kalshi_approved: true}
    # Government and official sources (treated as authoritative for these markets).
    - {name: "whitehouse_news", type: "rss", url: "https://www.whitehouse.gov/news/feed/", poll_interval_sec: 90, weight: 1.0, is_kalshi_approved: true}
    - {name: "whitehouse_press", type: "rss", url: "https://www.whitehouse.gov/briefing-room/press-briefings/feed/", poll_interval_sec: 90, weight: 1.0, is_kalshi_approved: true}
    - {name: "state_press", type: "rss", url: "https://www.state.gov/press-releases/feed/", poll_interval_sec: 90, weight: 1.0, is_kalshi_approved: true}
    - {name: "state_readouts", type: "rss", url: "https://www.state.gov/secretary-readouts/feed/", poll_interval_sec: 90, weight: 1.0, is_kalshi_approved: true}
    - {name: "dod_news", type: "rss", url: "https://www.defense.gov/DesktopModules/ArticleCS/RSS.ashx?ContentType=1&Site=945&max=10", poll_interval_sec: 90, weight: 1.0, is_kalshi_approved: true}
    # Press release distribution — lower weight because they distribute on
    # behalf of others.
    - {name: "pr_newswire_gov", type: "rss", url: "https://www.prnewswire.com/rss/policy-public-interest-latest-news/policy-public-interest-latest-news-list.rss", poll_interval_sec: 120, weight: 0.85, is_kalshi_approved: true}
    - {name: "business_wire", type: "rss", url: "https://feed.businesswire.com/rss/home/?rss=G1QFDERJXkJeGVtRVw==", poll_interval_sec: 120, weight: 0.85, is_kalshi_approved: true}
    # Verified social media. Twitter polling requires TWITTER_BEARER_TOKEN
    # in the environment; without it those sources are silently disabled
    # (a system_event records the disablement). Truth Social uses an
    # unauthenticated public scraper.
    - {name: "twitter:@WhiteHouse", type: "twitter", handle: "WhiteHouse", poll_interval_sec: 90, weight: 1.0, is_kalshi_approved: true}
    - {name: "twitter:@PressSec", type: "twitter", handle: "PressSec", poll_interval_sec: 90, weight: 1.0, is_kalshi_approved: true}
    - {name: "twitter:@POTUS", type: "twitter", handle: "POTUS", poll_interval_sec: 90, weight: 1.0, is_kalshi_approved: true}
    - {name: "twitter:@SecState", type: "twitter", handle: "SecState", poll_interval_sec: 90, weight: 1.0, is_kalshi_approved: true}
    - {name: "twitter:@StateDept", type: "twitter", handle: "StateDept", poll_interval_sec: 90, weight: 1.0, is_kalshi_approved: true}
    - {name: "twitter:@DeptofDefense", type: "twitter", handle: "DeptofDefense", poll_interval_sec: 90, weight: 0.9, is_kalshi_approved: true}
    - {name: "truth_social:@realDonaldTrump", type: "truth_social", handle: "realDonaldTrump", poll_interval_sec: 90, weight: 1.0, is_kalshi_approved: true}

matcher:
  # "auto" → ~/.config/trumpbot/subject_aliases.yaml (macOS) or
  #          /etc/trumpbot/subject_aliases.yaml (Linux). Optional.
  subject_aliases_path: "auto"
  body_match_window_chars: 500
  verb_proximity_chars: 200
  poll_interval_sec: 5
  batch_size: 100

database:
  # "auto" →
  #   ~/Library/Application Support/trumpbot/trumpbot.db (macOS)
  #   /var/lib/trumpbot/trumpbot.db                       (Linux)
  path: "auto"

health:
  host: "127.0.0.1"
  port: 9090

logging:
  level: "INFO"
  format: "json"

daemon:
  heartbeat_interval_sec: 60

discovery:
  # Monthly KXTRUMPMEET event auto-discovery. The service polls
  # /events/{event_ticker} for the current and next calendar month
  # every poll_interval_sec, upserts new markets, and writes
  # snapshot artifacts to snapshot_dir. See trumpbot/discovery/.
  series: "KXTRUMPMEET"
  poll_interval_sec: 3600
  backfill_months: 2
  # "auto" →
  #   ~/Library/Application Support/trumpbot/markets/ (macOS)
  #   /var/lib/trumpbot/markets/                       (Linux)
  snapshot_dir: "auto"
  # Optional. If present, the daemon upserts every entry into the
  # `subjects` table at startup so the matcher has a baseline of
  # known names even before the first discovery cycle runs. The
  # discovery service refines aliases with full-name forms from
  # actual market titles. "auto" → look in the platform config dir.
  initial_subjects_path: "auto"

telegram:
  # Phase 1 only sends one-way heads-up notifications (e.g. "new
  # month detected"). Leave both empty to disable; the daemon runs
  # without it. Bidirectional approval flow lands in Phase 3.
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"
