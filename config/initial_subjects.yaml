# Initial subjects seed — confirmed active in KXTRUMPMEET-26APR (22 markets).
#
# Loaded by the daemon at startup and upserted into the `subjects`
# table. The MarketDiscoveryService refines each subject when it
# polls the actual event (filling in the ticker_suffix and any
# additional aliases from the verbatim title).
#
# Aliases are pre-seeded as [full_name, last_name]. Phase 2 LLM
# enrichment will add role/title aliases ("Russian President",
# "Chinese President", etc.) and `upsert_subject` UNIONs new
# aliases into the stored set so manual additions never get
# overwritten.
#
# Edit this file to add or correct subjects, then restart the
# daemon. Re-runs are idempotent.

subjects:
  - subject_key: vladimirputin
    full_name: Vladimir Putin
    aliases: [Vladimir Putin, Putin]
  - subject_key: xijinping
    full_name: Xi Jinping
    aliases: [Xi Jinping, Xi]
  - subject_key: narendramodi
    full_name: Narendra Modi
    aliases: [Narendra Modi, Modi]
  - subject_key: benjaminnetanyahu
    full_name: Benjamin Netanyahu
    aliases: [Benjamin Netanyahu, Netanyahu, Bibi]
  - subject_key: volodymyrzelenskyy
    full_name: Volodymyr Zelenskyy
    aliases: [Volodymyr Zelenskyy, Zelenskyy, Zelensky]
